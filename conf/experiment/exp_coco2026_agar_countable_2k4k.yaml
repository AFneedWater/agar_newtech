# @package _global_

# AGAR COCO2026 dataset (countable_2k + countable_4k) in standard COCO layout.
# Each dataset root has:
#   annotations/instances_train2026.json
#   annotations/instances_val2026.json
#   train2026/*.jpg
#   val2026/*.jpg

data:
  source: coco
  coco_datasets:
    - coco_root: /work/home/zqy_885225/gh/do_dataset/outputs/agar7dataset/agar_countable_2k
      train_ann: annotations/instances_train2026.json
      val_ann: annotations/instances_val2026.json
      train_images: train2026
      val_images: val2026
    - coco_root: /work/home/zqy_885225/gh/do_dataset/outputs/agar7dataset/agar_countable_4k
      train_ann: annotations/instances_train2026.json
      val_ann: annotations/instances_val2026.json
      train_images: train2026
      val_images: val2026
  concat_val: true
  batch_size: 16
  num_workers: 8

model:
  num_classes: 7

